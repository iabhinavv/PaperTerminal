<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperTerminal</title>
<link rel="stylesheet" href="css/terminal.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><text x='8' y='12' font-size='11' font-family='monospace' fill='%23ff9e1b' text-anchor='middle'>P</text></svg>">
</head>
<body>
<div id="app">

  <div id="cmdbar">
    <div class="brand">PAPERTERMINAL</div>
    <div id="cmdwrap">
      <input id="cmdline" autocomplete="off" spellcheck="false"
             placeholder="Type a ticker or a function — AAPL US &lt;Equity&gt; GO · PORT · MARG · OMON · HELP">
      <div id="autocomplete" hidden></div>
    </div>
    <a class="guidelink" href="guide/" target="_blank" rel="noopener"
       title="Open the guide: every function explained, trade walkthroughs, and a 273-term guidebook">GUIDE</a>
    <div class="go" id="gobtn">GO &lt;RETURN&gt;</div>
  </div>

  <div id="fkeys"></div>

  <div id="grid"></div>

  <div id="tape"><div class="track" id="tapetrack"></div></div>

  <div id="status">
    <div class="s"><b>ACCT</b><span id="st-equity">—</span></div>
    <div class="s"><b>CASH</b><span id="st-cash">—</span></div>
    <div class="s"><b>P&amp;L</b><span id="st-pnl">—</span></div>
    <div class="s"><b>BUY PWR</b><span id="st-bp">—</span></div>
    <div class="s"><b>MARGIN</b><span id="st-margin">—</span></div>
    <div class="spacer"></div>
    <div class="s"><b>MKTS</b><div id="sessions"></div></div>
    <div class="s"><b>FEED</b><span id="st-feed" class="dead">INIT</span></div>
    <div class="s"><span id="st-clock">--:--:--</span></div>
  </div>

</div>

<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
