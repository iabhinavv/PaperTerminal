<!doctype html>
<meta charset="utf-8">
<title>PaperTerminal</title>
<!--
  The application lives in web/. This file exists only so that GitHub Pages
  deployed from the branch root lands on the terminal instead of rendering
  README.md as the site.

  If you set Pages Source to "GitHub Actions", .github/workflows/pages.yml
  publishes web/ as the site root and this file is never served.
-->
<meta http-equiv="refresh" content="0; url=web/">
<link rel="canonical" href="web/">
<style>
  html { background: #000; color: #ff9e1b;
         font-family: 'SF Mono', Menlo, Consolas, monospace; }
  body { display: grid; place-items: center; height: 100vh; margin: 0; }
  a { color: #4fc3f7; }
</style>
<body>
  <p>Loading PaperTerminal — <a href="web/">continue</a> if nothing happens.</p>
</body>
