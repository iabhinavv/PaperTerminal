name: Market snapshot

# Refreshes web/data/snapshot.json so a pure-static deploy (GitHub Pages,
# Netlify, any file server) still shows equities, indices and bond yields.
# Crypto and FX stay live in the browser regardless — their CORS is open.

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'   # every 10 min through the US session
    - cron: '0 1,3,5,7,9 * * 1-5'  # a few passes across the Asian session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch snapshot
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python3 tools/snapshot.py

      - name: Commit if changed
        run: |
          git config user.name  "paperterminal-bot"
          git config user.email "noreply@github.com"
          git add web/data/snapshot.json
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
