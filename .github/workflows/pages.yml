name: Deploy to GitHub Pages

# Publishes the web/ folder as the site root, so the terminal lives at
# https://<user>.github.io/<repo>/ rather than the README.
#
# Set Settings -> Pages -> Source to "GitHub Actions" once, and this takes over.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Refresh prices at build time. Falls back to whatever snapshot is already
      # committed if no provider answers, so a deploy never ships a blank board.
      - name: Refresh market snapshot
        continue-on-error: true
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python3 tools/snapshot.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
